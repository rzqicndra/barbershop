name: gilir-check
services:
  db-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: gilir_test
      POSTGRES_USER: gilir_test_runner
      POSTGRES_PASSWORD: integration-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gilir_test_runner -d gilir_test']
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://gilir_test_runner:integration-only-password@db-test:5432/gilir_test?sslmode=disable
    depends_on:
      db-test:
        condition: service_healthy
